<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>天國小勇士的抉擇冒險</title>
    <style>
        body { 
            font-family: "Microsoft JhengHei", Arial, sans-serif; 
            background-color: #f0f2f5; 
            margin: 0; 
            padding: 20px; 
            display: flex; 
            flex-direction: column;
            align-items: center; /* 讓畫面置中，適合投影 */
        }
        .container { 
            width: 100%; 
            max-width: 800px; /* 限制最大寬度，閱讀起來較舒適 */
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        
        /* 標題與隱藏開關區塊 */
        .header-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #1a73e8; 
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        h2 { 
            color: #1a73e8; 
            margin: 0;
        }
        /* 隱藏的設定按鈕 */
        #toggle-edit-btn {
            background: none;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.2; /* 預設很透明，學生不容易發現 */
            transition: 0.3s;
        }
        #toggle-edit-btn:hover {
            opacity: 1; /* 滑鼠移過去才會變明顯 */
        }

        /* 遊戲區樣式 */
        #game-area { border-left: 8px solid #1a73e8; }
        .story-text { font-size: 1.3rem; line-height: 1.8; margin-bottom: 30px; white-space: pre-wrap; color: #333;}
        .option-btn { 
            display: block; 
            width: 100%; 
            text-align: left; 
            padding: 15px 20px; 
            margin: 12px 0; 
            background-color: white; 
            border: 2px solid #dadce0; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 1.1rem; 
            transition: 0.2s; 
            color: #202124;
        }
        .option-btn:hover { background-color: #e8f0fe; border-color: #1a73e8; }
        
        /* 編輯區樣式（預設隱藏） */
        #edit-area { 
            background-color: #f8f9fa; 
            display: none; /* 預設為不顯示 */
            border-left: 8px solid #dc3545;
        }
        textarea { width: 100%; height: 400px; font-family: monospace; font-size: 14px; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn { background-color: #1a73e8; color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-size: 1rem; margin-top: 10px; font-weight: bold;}
        .btn:hover { background-color: #1557b0; }
        .btn-danger { background-color: #dc3545; margin-left: 10px; }
        .btn-danger:hover { background-color: #c82333; }
        .hint { color: #666; font-size: 1rem; margin-bottom: 15px; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="game-area" class="container">
        <div class="header-container">
            <h2>🎮 天國小勇士的冒險</h2>
            <button id="toggle-edit-btn" onclick="toggleEditor()" title="教員專用：開啟/關閉劇情編輯器">⚙️</button>
        </div>

        <br>
        <button class="btn" onclick="updateStoryData()">🔄 更新劇情並暫存</button>
        <button class="btn btn-danger" onclick="resetToDefault()">🗑️ 清除暫存並恢復預設</button>

let storyData;

// 切換編輯器顯示/隱藏的函式
function toggleEditor() {
    const editArea = document.getElementById('edit-area');
    if (editArea.style.display === "none" || editArea.style.display === "") {
        editArea.style.display = "block";
        // 自動捲動到編輯器位置
        editArea.scrollIntoView({ behavior: 'smooth' });
    } else {
        editArea.style.display = "none";
    }
}

// 頁面載入時，檢查是否有暫存的資料
window.onload = function() {
    const savedData = localStorage.getItem(STORAGE_KEY);
    if (savedData) {
        try {
            storyData = JSON.parse(savedData);
            console.log("已成功載入本機暫存劇情。");
        } catch (e) {
            console.error("暫存資料格式錯誤，載入預設劇情。", e);
            storyData = JSON.parse(JSON.stringify(defaultData));
        }
    } else {
        storyData = JSON.parse(JSON.stringify(defaultData));
    }
    
    // 將資料填入編輯器的文字框中
    document.getElementById('json-input').value = JSON.stringify(storyData, null, 4);
    
    // 網頁開啟時自動啟動第一關
    renderScene("1-1");
};

// 渲染當前遊戲情境的函式
function renderScene(sceneId) {
    const scene = storyData[sceneId];
    if (!scene) {
        document.getElementById('story').innerText = "錯誤：找不到情境代碼 「" + sceneId + "」，請檢查右側後台設定！";
        document.getElementById('options').innerHTML = `<button class="option-btn" onclick="renderScene('1-1')">重回起點 (1-1)</button>`;
        return;
    }

    document.getElementById('current-id').innerText = "當前情境編號：" + sceneId;
    document.getElementById('story').innerText = scene.text;
    
    let optionsHtml = "";
    scene.options.forEach(opt => {
        optionsHtml += `<button class="option-btn" onclick="renderScene('${opt.nextField}')">${opt.text}</button>`;
    });
    document.getElementById('options').innerHTML = optionsHtml;
}

// 更新編輯器劇情並暫存到本機的函式
function updateStoryData() {
    try {
        const rawJson = document.getElementById('json-input').value;
        storyData = JSON.parse(rawJson); // 測試解析是否成功
        
        // 儲存到 LocalStorage
        localStorage.setItem(STORAGE_KEY, rawJson);
        
        alert("🎉 劇情更新並暫存成功！重新整理網頁也不會遺失修改內容。遊戲將從起點重新開始。");
        
        // 隱藏編輯器並重新開始遊戲
        document.getElementById('edit-area').style.display = "none";
        renderScene("1-1");
        
        // 畫面捲回最上方
        window.scrollTo({ top: 0, behavior: 'smooth' });
    } catch (e) {
        alert("❌ JSON 格式有錯誤，請檢查標點符號（逗號或括號）！錯誤訊息：\n" + e.message);
    }
}

// 清除暫存並恢復預設的函式
function resetToDefault() {
    if (confirm("⚠️ 確定要清除所有暫存的修改，恢復成最初始的劇情嗎？這個動作無法復原！")) {
        localStorage.removeItem(STORAGE_KEY);
        storyData = JSON.parse(JSON.stringify(defaultData));
        document.getElementById('json-input').value = JSON.stringify(storyData, null, 4);
        renderScene("1-1");
        
        document.getElementById('edit-area').style.display = "none";
        window.scrollTo({ top: 0, behavior: 'smooth' });
        
        alert("🗑️ 暫存已清除，劇情已恢復預設！");
    }
}
</script>
